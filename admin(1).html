<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت خدمت‌یار</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#132f4b;font:16px/1.8 Tahoma,sans-serif}.box,.card{background:#fff;border-radius:18px;padding:18px;margin:14px auto;max-width:860px;box-shadow:0 10px 26px #07274c14}#login{max-width:380px;margin-top:12vh}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #cfdbe7;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:10px 16px;font:700 15px Tahoma;cursor:pointer;background:#07529a;color:#fff;margin:3px}
button.g{background:#f2b935;color:#15324d}button.r{background:#c0392b}button.o{background:#e8eef5;color:#132f4b}
header{background:linear-gradient(135deg,#062c50,#0a4170);color:#ffd978;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:6px;flex-wrap:wrap;max-width:860px;margin:12px auto;padding:0 10px}nav button.on{background:#f2b935;color:#15324d}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e3ebf3;padding:10px 0}.st{font-size:12px;padding:2px 10px;border-radius:99px;background:#fff3c4}.st.approved{background:#d1fae5}.st.rejected,.st.hidden{background:#fee2e2}small{color:#60758b}pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#eef5fc;padding:10px;border-radius:10px;user-select:all;font-size:13px}#lm{line-height:1.9;color:#a33}img.pv{max-width:100%;max-height:160px;border-radius:12px;margin:6px 0}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap"><style>body,input,select,textarea,button{font-family:Vazirmatn,Tahoma,sans-serif!important}</style></head><body>
<div id="login" class="box"><h2>🔒 ورود مدیر</h2><input id="em" type="email" placeholder="ایمیل" autocomplete="username"><input id="pw" type="password" placeholder="رمز" autocomplete="current-password"><button id="in">ورود</button><p id="lm"></p></div>
<div id="app" hidden><header><b>پنل مدیریت خدمت‌یار</b><button class="o" id="out">خروج</button></header>
<nav><button data-t="p" class="on">همکاران</button><button data-t="a">تبلیغات</button><button data-t="m">بازار</button><button data-t="s">تنظیمات</button></nav>
<div id="tp"></div><div id="tm" hidden></div>
<div id="ta" hidden><div class="card"><h3 id="ft">آگهی جدید</h3><input type="hidden" id="aid"><input id="an" placeholder="نام کسب‌وکار / برند / محصول *"><select id="at"><option>رستورانت</option><option>کافه و فست‌فود</option><option>فروشگاه</option><option>محصول و برند</option><option>خدمات</option><option>سایر</option></select><textarea id="ad" rows="2" placeholder="توضیح، تخفیف یا پیشنهاد ویژه"></textarea><input id="aa" placeholder="آدرس"><input id="ap" placeholder="شمارهٔ تماس / واتساپ"><input id="am" placeholder="لینک نقشه (اختیاری)"><label>عکس اصلی (آپلود مستقیم)</label><input type="file" id="af" accept="image/*"><img id="apv" class="pv" hidden><textarea id="amn" rows="4" placeholder="مینو یا محصولات؛ هر خط: نام | قیمت | لینک عکس (اختیاری)"></textarea><label>از تاریخ</label><input type="date" id="as"><label>تا تاریخ (خالی = بدون پایان)</label><input type="date" id="ae"><select id="ast"><option value="approved">نمایش به همه</option><option value="hidden">پنهان</option></select><button class="g" id="asv">ذخیرهٔ آگهی</button><button class="o" id="acl">فرم جدید</button><p id="am2"></p></div><div id="al"></div></div>
<div id="ts" hidden><div class="card"><h3>عکس بالای صفحهٔ اصلی (روضه)</h3><input type="file" id="hf" accept="image/*"><img id="hpv" class="pv" hidden><button class="g" id="hsv">ذخیره و نمایش برای همه</button><button class="o" id="hrs">بازگشت به عکس پیش‌فرض</button><p id="hm"></p></div></div></div>
<script>
const SB='https://rkkjbkmnhzccucqbrqqt.supabase.co',K='sb_publishable_Ty6EvQ6_VTkxHE8alPnH3A_bEeUyJq-';let T=sessionStorage.getItem('t')||'',IMG='';
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function api(p,m='GET',b,pf='return=representation'){const r=await fetch(SB+'/rest/v1/'+p,{method:m,headers:{apikey:K,Authorization:'Bearer '+T,'Content-Type':'application/json',Prefer:pf},body:b?JSON.stringify(b):undefined});if(r.status===401){out();throw Error('نشست تمام شد')}if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const w=Math.min(1280,i.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(i.height*w/i.width);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>ok(b),'image/jpeg',.8)};i.onerror=()=>no(Error('عکس معتبر نیست'));i.src=URL.createObjectURL(f)})}
async function up(f,dir){const b=await shrink(f),n=dir+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',r=await fetch(SB+'/storage/v1/object/media/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+T,'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw Error('آپلود نشد: '+await r.text());return SB+'/storage/v1/object/public/media/'+n}
function out(){T='';sessionStorage.removeItem('t');$('app').hidden=true;$('login').hidden=false}
$('out').onclick=out;
let UID='',UEM='';
$('in').onclick=async()=>{const m=$('lm');m.textContent='در حال ورود...';try{
const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
const j=await r.json().catch(()=>({}));
if(!j.access_token)throw Error('ورود ناموفق: '+(j.msg||j.error_description||j.message||r.status)+(j.error_code?' ('+j.error_code+')':'')+' — ایمیل و رمز را با کاربری که در Authentication ← Users ساخته‌ای مقایسه کن.');
T=j.access_token;UID=(j.user||{}).id;UEM=(j.user||{}).email;let a;
try{a=await api('admins?select=user_id')}catch(x){out();throw Error(String(x.message).includes('PGRST205')?'جدول‌ها هنوز در Supabase ساخته نشده‌اند. فایل supabase-setup.sql را کامل در SQL Editor اجرا کن (Run) و اگر خطا داد، متن خطا را بفرست.':'خطای دسترسی به پایگاه داده: '+String(x.message).slice(0,160)+' — فایل supabase-fix.sql را در SQL Editor اجرا کن.')}
if(!a.length){out();m.innerHTML='ورود درست بود، ولی این ایمیل (<b dir="ltr">'+e(UEM)+'</b>) هنوز مدیر ثبت نشده. این خط را در SQL Editor اجرا کن و دوباره وارد شو:<pre>insert into admins(user_id) values (\''+e(UID)+'\') on conflict do nothing;</pre>';return}
sessionStorage.setItem('t',T);m.textContent='';start()}catch(x){m.textContent=x.message}};
$('pw').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('in').click()});
function start(){$('login').hidden=true;$('app').hidden=false;Promise.all([lp(),la(),lm()]).catch(x=>alert('خطا در بارگذاری: '+x.message))}
document.querySelector('nav').onclick=ev=>{const b=ev.target.closest('[data-t]');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['p','a','m','s'].forEach(t=>$('t'+t).hidden=t!==b.dataset.t)};
const SL={pending:'در انتظار',approved:'تأیید',rejected:'ردشده',hidden:'پنهان'};
async function lp(){const d=await api('providers?select=*&order=id.desc');$('tp').innerHTML='<div class="card"><h3>همکاران ('+d.length+')</h3>'+(d.map(x=>'<div class="row"><div><b>'+e(x.name)+'</b> <span class="st '+x.status+'">'+SL[x.status]+'</span><br><small>'+e(x.cats.join('، '))+' | '+e(x.all_areas?'همه نواحی':x.areas.join('، '))+'<br>'+e(x.phone)+' — '+e(x.address||'')+'</small></div><div><button data-p="approved" data-i="'+x.id+'">تأیید</button><button class="o" data-p="rejected" data-i="'+x.id+'">رد</button><button class="r" data-d="'+x.id+'">حذف</button></div></div>').join('')||'<p>موردی نیست.</p>')+'</div>'}
$('tp').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.p)await api('providers?id=eq.'+b.dataset.i,'PATCH',{status:b.dataset.p});else if(b.dataset.d&&confirm('حذف شود؟'))await api('providers?id=eq.'+b.dataset.d,'DELETE');lp()}catch(x){alert(x.message)}};
let AD=[];async function la(){AD=await api('ads?select=*&order=id.desc');$('al').innerHTML='<div class="card"><h3>آگهی‌ها ('+AD.length+')</h3>'+(AD.map(x=>'<div class="row"><div><b>'+e(x.name)+'</b> <span class="st '+x.status+'">'+SL[x.status]+'</span><br><small>'+e(x.type)+' | '+e(x.ends_at||'بدون پایان')+'</small></div><div><button data-e="'+x.id+'">ویرایش</button><button class="r" data-x="'+x.id+'">حذف</button></div></div>').join('')||'<p>آگهی‌ای نیست.</p>')+'</div>'}
function clr(){['aid','an','ad','aa','ap','am','amn','as','ae'].forEach(i=>$(i).value='');IMG='';$('apv').hidden=true;$('af').value='';$('ft').textContent='آگهی جدید'}
$('acl').onclick=clr;
$('af').onchange=async ev=>{try{$('am2').textContent='در حال آپلود...';IMG=await up(ev.target.files[0],'ads');$('apv').src=IMG;$('apv').hidden=false;$('am2').textContent='عکس آپلود شد ✓'}catch(x){$('am2').textContent=x.message}};
$('al').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.x&&confirm('حذف شود؟')){await api('ads?id=eq.'+b.dataset.x,'DELETE');la()}if(b.dataset.e){const x=AD.find(a=>a.id==b.dataset.e);$('aid').value=x.id;$('an').value=x.name;$('at').value=x.type;$('ad').value=x.description||'';$('aa').value=x.address||'';$('ap').value=x.phone||'';$('am').value=x.map_url||'';IMG=x.image_url||'';$('apv').src=IMG;$('apv').hidden=!IMG;$('amn').value=(x.menu||[]).map(m=>[m.name,m.price,m.image].filter((v,i)=>v||i<2).join(' | ')).join('\n');$('as').value=x.starts_at||'';$('ae').value=x.ends_at||'';$('ast').value=x.status;$('ft').textContent='ویرایش آگهی';scrollTo(0,0)}}catch(x){alert(x.message)}};
$('asv').onclick=async()=>{if(!$('an').value.trim())return alert('نام را وارد کن');const menu=$('amn').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]).map(p=>({name:p[0],price:p[1]||'',image:/^https?:/.test(p[2]||'')?p[2]:''})),o={name:$('an').value.trim(),type:$('at').value,description:$('ad').value.trim(),address:$('aa').value.trim(),phone:$('ap').value.trim(),map_url:$('am').value.trim()||null,image_url:IMG||null,menu,starts_at:$('as').value||null,ends_at:$('ae').value||null,status:$('ast').value};try{$('aid').value?await api('ads?id=eq.'+$('aid').value,'PATCH',o):await api('ads','POST',o);$('am2').textContent='ذخیره شد ✓';clr();la()}catch(x){$('am2').textContent=x.message}};
$('hf').onchange=async ev=>{try{$('hm').textContent='در حال آپلود...';HI=await up(ev.target.files[0],'hero');$('hpv').src=HI;$('hpv').hidden=false;$('hm').textContent='آماده؛ «ذخیره» را بزن.'}catch(x){$('hm').textContent=x.message}};let HI='';
$('hsv').onclick=async()=>{if(!HI)return alert('اول عکس انتخاب کن');try{await api('settings','POST',{key:'hero',value:{image:HI}},'resolution=merge-duplicates,return=minimal');$('hm').textContent='ذخیره شد ✓'}catch(x){$('hm').textContent=x.message}};
$('hrs').onclick=async()=>{try{await api('settings?key=eq.hero','DELETE');$('hm').textContent='عکس پیش‌فرض برگشت ✓'}catch(x){$('hm').textContent=x.message}};
const LS={pending:'در انتظار',approved:'تأیید',sold:'فروخته شد',rejected:'ردشده'};
async function lm(){const d=await api('listings?select=*&order=id.desc');$('tm').innerHTML='<div class="card"><h3>آگهی‌های بازار ('+d.length+')</h3>'+(d.map(x=>'<div class="row"><div>'+(x.images[0]?'<img class="pv" style="max-height:80px" src="'+e(x.images[0])+'"><br>':'')+'<b>'+e(x.title)+'</b> <span class="st '+(x.status==='approved'?'approved':x.status==='pending'?'':'rejected')+'">'+LS[x.status]+'</span><br><small>'+e(x.kind)+' | '+e(x.price||'')+' | '+e(x.phone)+'<br>'+e(JSON.stringify(x.attrs))+'</small></div><div><button data-m="approved" data-i="'+x.id+'">تأیید</button><button class="g" data-m="sold" data-i="'+x.id+'">فروخته شد</button><button class="o" data-m="rejected" data-i="'+x.id+'">رد</button><button class="r" data-md="'+x.id+'">حذف</button></div></div>').join('')||'<p>آگهی‌ای نیست.</p>')+'</div>'}
$('tm').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.m)await api('listings?id=eq.'+b.dataset.i,'PATCH',{status:b.dataset.m});else if(b.dataset.md&&confirm('حذف شود؟'))await api('listings?id=eq.'+b.dataset.md,'DELETE');lm()}catch(x){alert(x.message)}};
if(T)api('admins?select=user_id').then(a=>a.length?start():out()).catch(out);
</script></body></html>
