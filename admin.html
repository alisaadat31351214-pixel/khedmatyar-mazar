const VS1=V.s;V.s=function(){const c=ST().contact||{};return VS1()+'<div class="card"><h2 style="margin-top:0">📞 ارتباط با ما (روی سایت)</h2><p class="mu">هر راهی را که خالی بگذاری نشان داده نمی‌شود. هر وقت خواستی عوضش کن.</p><label class="chk"><input type="checkbox" id="cOn"'+(c.on?' checked':'')+'> نمایش بخش ارتباط با ما</label><div class="fg"><div><label>واتساپ (با کد کشور، مثل 937XXXXXXXX)</label><input id="cWa" value="'+e(c.wa||'')+'"></div><div><label>تلگرام (نام کاربری)</label><input id="cTg" value="'+e(c.tg||'')+'"></div><div><label>ایمیل</label><input id="cEm" value="'+e(c.em||'')+'"></div><div><label>تلفن</label><input id="cPh" value="'+e(c.ph||'')+'"></div><div class="fw"><label>متن کوتاه</label><input id="cTx" value="'+e(c.text||'')+'"></div></div>'+btn('sc','ok','💾 ذخیره',{})+'</div><div class="card"><h2 style="margin-top:0">💾 پشتیبان‌گیری</h2><p class="mu">یک فایل JSON از همهٔ داده‌ها دانلود می‌شود. هفته‌ای یک بار بگیر.</p>'+btn('bk','gd','⬇️ دانلود پشتیبان',{})+'</div>'};
const VP0=V.p;V.p=function(){return'<div class="bar"><span class="mu">همکاران ثبت‌شده</span>'+btn('pnew','gd','＋ افزودن همکار',{})+'</div><div id="pf" class="card" hidden><h2 id="pft" style="margin-top:0">همکار جدید</h2><input type="hidden" id="pid"><div class="fg"><div><label>نام *</label><input id="pn"></div><div><label>تلفن / واتساپ *</label><input id="pp" inputmode="tel"></div><div class="fw"><label>آدرس</label><input id="pa"></div><div class="fw"><label>حرفه‌ها</label><div class="g2">'+Object.keys(CT().tree).map(k=>'<label class="chk"><input type="checkbox" class="pc2" value="'+e(k)+'"> '+e(k)+'</label>').join('')+'</div></div><div><label>وضعیت</label><select id="ps2"><option value="approved">تأیید شده</option><option value="pending">در انتظار</option><option value="rejected">پنهان</option></select></div></div>'+btn('psave','ok','💾 ذخیره',{})+btn('pcancel','gy','انصراف',{})+'</div>'+VP0().replace(/<button class="bt rd" data-act="pd" data-i="(\d+)">/g,'<button class="bt gd" data-act="pe" data-i="$1">✏️</button>$&')};
function pform(x){$('pf').hidden=false;$('pid').value=x.id||'';$('pn').value=x.name||'';$('pp').value=x.phone||'';$('pa').value=x.address||'';$('ps2').value=x.status||'approved';document.querySelectorAll('.pc2').forEach(i=>i.checked=(x.cats||[]).includes(i.value));$('pft').textContent=x.id?'ویرایش همکار':'همکار جدید';$('pf').scrollIntoView({behavior:'smooth'})}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset;try{switch(d.act){
case'pnew':pform({});break;case'pcancel':$('pf').hidden=true;break;
case'pe':pform(D.p.find(x=>x.id==d.i));break;
case'psave':{const n=$('pn').value.trim(),p=$('pp').value.replace(/[\s-]/g,'');if(n.length<2||p.length<7)return toast('نام و شمارهٔ درست را بنویس',0);const o={name:n,phone:p,address:$('pa').value.trim()||null,cats:[...document.querySelectorAll('.pc2:checked')].map(i=>i.value),status:$('ps2').value};if($('pid').value)await api('providers?id=eq.'+$('pid').value,'PATCH',o);else await api('providers','POST',{...o,all_areas:true,areas:[]});toast('همکار ذخیره شد ✓');await load();break}
case'mr2':await api('messages?id=eq.'+d.i,'PATCH',{status:'read'});await load();break;
case'mdel2':if(confirm('این پیام حذف شود؟')){await api('messages?id=eq.'+d.i,'DELETE');await load()}break;
case'sc':await saveSite({contact:{on:$('cOn').checked,wa:$('cWa').value.trim(),tg:$('cTg').value.trim(),em:$('cEm').value.trim(),ph:$('cPh').value.trim(),text:$('cTx').value.trim()}});break;
case'bk':{const o={date:new Date().toISOString(),providers:D.p,ads:D.a,listings:D.m,messages:D.i||[],site:D.site,cats:D.cats},u=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='khedmatyar-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();toast('پشتیبان دانلود شد ✓');break}
}}catch(x){toast(String(x.message).slice(0,140),0)}});

const VS2=V.s;V.s=function(){const b=(ST().brand)||{};return VS2()+'<div class="card"><h2 style="margin-top:0">🏷️ لوگو و متن‌های صفحهٔ اصلی</h2><p class="mu">هرچه اینجا بنویسی و ذخیره کنی، روی همهٔ دستگاه‌ها عوض می‌شود. خالی بگذاری، متن پیش‌فرض می‌ماند.</p><label>لوگوی سایت (از گالری؛ بهتر است PNG مربع باشد)</label><input type="file" id="blf" accept="image/*"><input type="hidden" id="bLg" value="'+e(b.logo||'')+'"><img id="blp" class="pv" style="max-height:90px" '+(b.logo?'src="'+e(b.logo)+'"':'hidden')+' alt=""><div class="fg"><div><label>نام سایت (بالای صفحه)</label><input id="bNm" value="'+e(b.name||'')+'" placeholder="خدمت‌یار مزارشریف"></div><div><label>شعار زیر نام</label><input id="bTg" value="'+e(b.tag||'')+'" placeholder="راه ساده‌تر برای پیدا کردن خدمات محلی"></div><div><label>کلمهٔ اول عنوان بزرگ</label><input id="bB1" value="'+e(b.b1||'')+'" placeholder="خدمت‌یار"></div><div><label>کلمهٔ دوم (طلایی)</label><input id="bB2" value="'+e(b.b2||'')+'" placeholder="مزارشریف"></div><div class="fw"><label>جملهٔ زیر عنوان</label><input id="bTt" value="'+e(b.title||'')+'" placeholder="همه چیز برای کسب‌وکار شما در یکجا!"></div><div class="fw"><label>توضیح کوتاه</label><textarea id="bTx" rows="2">'+e(b.text||'')+'</textarea></div></div>'+btn('sb','ok','💾 ذخیره و انتشار',{})+btn('sbr','gy','↩ پیش‌فرض',{})+'</div>'};
document.addEventListener('change',async ev=>{if(ev.target.id!=='blf'||!ev.target.files[0])return;try{toast('در حال آپلود لوگو…');const u=await up(ev.target.files[0],'brand','image/png',512);$('bLg').value=u;$('blp').src=u;$('blp').hidden=false;toast('لوگو آماده شد؛ «ذخیره» را بزن ✓')}catch(x){toast(x.message,0)}});
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;try{if(b.dataset.act==='sb')await saveSite({brand:{logo:$('bLg').value,name:$('bNm').value.trim(),tag:$('bTg').value.trim(),b1:$('bB1').value.trim(),b2:$('bB2').value.trim(),title:$('bTt').value.trim(),text:$('bTx').value.trim()}});if(b.dataset.act==='sbr'&&confirm('لوگو و متن‌ها به پیش‌فرض برگردد؟')){await saveSite({brand:{}});show('s')}}catch(x){toast(String(x.message).slice(0,140),0)}});
if(T)api('admins?select=user_id').then(a=>a.length?start():out()).catch(out);
</script></body></html>
