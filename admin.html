const VP0=V.p;V.p=function(){return'<div class="bar"><span class="mu">همکاران ثبت‌شده</span>'+btn('pnew','gd','＋ افزودن همکار',{})+'</div><div id="pf" class="card" hidden><h2 id="pft" style="margin-top:0">همکار جدید</h2><input type="hidden" id="pid"><div class="fg"><div><label>نام *</label><input id="pn"></div><div><label>تلفن / واتساپ *</label><input id="pp" inputmode="tel"></div><div class="fw"><label>آدرس</label><input id="pa"></div><div class="fw"><label>حرفه‌ها</label><div class="g2">'+Object.keys(CT().tree).map(k=>'<label class="chk"><input type="checkbox" class="pc2" value="'+e(k)+'"> '+e(k)+'</label>').join('')+'</div></div><div><label>وضعیت</label><select id="ps2"><option value="approved">تأیید شده</option><option value="pending">در انتظار</option><option value="rejected">پنهان</option></select></div></div>'+btn('psave','ok','💾 ذخیره',{})+btn('pcancel','gy','انصراف',{})+'</div>'+VP0().replace(/<button class="bt rd" data-act="pd" data-i="(\d+)">/g,'<button class="bt gd" data-act="pe" data-i="$1">✏️</button>$&')};
function pform(x){$('pf').hidden=false;$('pid').value=x.id||'';$('pn').value=x.name||'';$('pp').value=x.phone||'';$('pa').value=x.address||'';$('ps2').value=x.status||'approved';document.querySelectorAll('.pc2').forEach(i=>i.checked=(x.cats||[]).includes(i.value));$('pft').textContent=x.id?'ویرایش همکار':'همکار جدید';$('pf').scrollIntoView({behavior:'smooth'})}

case'bk':{const o={date:new Date().toISOString(),providers:D.p,ads:D.a,listings:D.m,messages:D.i||[],site:D.site,cats:D.cats},u=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='khedmatyar-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();toast('پشتیبان دانلود شد ✓');break}
}}catch(x){toast(String(x.message).slice(0,140),0)}});

const PRS=[['پیش‌فرض','#062c50','#0a4170','#f2b935','#0a5aa6','#07529a'],['هم‌رنگ لوگو','#0b3d33','#14664f','#f2b935','#2f9e5a','#14664f'],['نوروز و بهار','#14532d','#15803d','#fde047','#22c55e','#15803d'],['تابستان','#0c4a6e','#0369a1','#fbbf24','#0ea5e9','#0369a1'],['پاییز','#7c2d12','#b45309','#fcd34d','#ea580c','#b45309'],['زمستان','#1e293b','#334155','#93c5fd','#3b82f6','#1d4ed8'],['ولادت و عید','#064e3b','#047857','#fcd34d','#10b981','#047857'],['شهادت و سوگ','#111827','#1f2937','#9ca3af','#374151','#111827']];

const VS3=V.s;V.s=function(){const t=ST().theme||{},ev=D.ev||(D.ev=(ST().events||EVD).map(x=>({...x})));return VS3()+'<div class="card"><h2 style="margin-top:0">🎨 رنگ‌های سایت</h2><p class="mu">یکی از تم‌ها را بزن یا رنگ‌ها را خودت انتخاب کن. بعد از «ذخیره»، سایت روی همهٔ دستگاه‌ها رنگ جدید می‌گیرد. برای هر مناسبت (ولادت، شهادت، نوروز، فصل‌ها) تم مناسبش را بزن و بعد از مناسبت به «پیش‌فرض» برگردان.</p><div class="fl">'+PRS.map((p,i)=>'<button data-act="thp" data-i="'+i+'" style="border-left:14px solid '+p[1]+'">'+p[0]+'</button>').join('')+'</div><div class="g2"><div><label>رنگ اصلی (هدر و منو)</label><input type="color" id="tc1" value="'+(t.c1||PRS[0][1])+'"></div><div><label>رنگ دوم (گرادیان)</label><input type="color" id="tc2" value="'+(t.c2||PRS[0][2])+'"></div><div><label>رنگ تأکید (طلایی)</label><input type="color" id="tac" value="'+(t.ac||PRS[0][3])+'"></div><div><label>رنگ دکمه‌ها (۱)</label><input type="color" id="tb1" value="'+(t.b1||PRS[0][4])+'"></div><div><label>رنگ دکمه‌ها (۲)</label><input type="color" id="tb2" value="'+(t.b2||PRS[0][5])+'"></div></div>'+btn('ths','ok','💾 ذخیره و انتشار',{})+btn('thr','gy','↩ پیش‌فرض',{})+'</div><div class="card"><h2 style="margin-top:0">📅 مناسبت‌های تقویم</h2><p class="mu">نوع تاریخ (شمسی یا قمری)، ماه (۱ تا ۱۲)، روز و نام مناسبت را بنویس. ولادت و شهادت‌ها معمولاً قمری‌اند (مثلاً ربیع‌الاول = ماه ۳). تاریخ قمری تقریبی است و ممکن است یک روز با رؤیت هلال فرق کند.</p><div id="evl">'+ev.map(evRow).join('')+'</div>'+btn('evadd','gy','＋ مناسبت جدید',{})+btn('evs','ok','💾 ذخیره و انتشار',{})+'</div>'};
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset;try{switch(d.act){
case'thp':{const p=PRS[+d.i];['tc1','tc2','tac','tb1','tb2'].forEach((id,k)=>$(id).value=p[k+1]);toast('تم انتخاب شد؛ «ذخیره» را بزن');break}

const bnR=(b,i)=>'<div class="card bnr" style="margin:8px 0;background:#f3f8fd;box-shadow:none"><input type="file" class="bnf" accept="image/*"><input type="hidden" class="bni" value="'+e(b.img||'')+'"><img class="pv bnp" style="max-height:90px" '+(b.img?'src="'+e(b.img)+'"':'hidden')+' alt=""><div class="fg"><div><label>عنوان روی بنر (اختیاری)</label><input class="bnt" value="'+e(b.title||'')+'"></div><div><label>لینک مقصد (اختیاری)</label><input class="bnl" value="'+e(b.link||'')+'" placeholder="https://..."></div><div><label>از تاریخ</label><input type="date" class="bns" value="'+e(b.start||'')+'"></div><div><label>تا تاریخ</label><input type="date" class="bne" value="'+e(b.end||'')+'"></div></div><label class="chk"><input type="checkbox" class="bno"'+(b.on===false?'':' checked')+'> نمایش</label><button type="button" class="bt rd" data-act="bndel" data-i="'+i+'">🗑 حذف بنر</button></div>';

const VS4=V.s;V.s=function(){const l=D.bn||(D.bn=(ST().banners||[]).map(x=>({...x})));return VS4()+'<div class="card"><h2 style="margin-top:0">🖼️ بنرهای تبلیغاتی صفحهٔ اصلی</h2><p class="mu">عکس بنر را از گالری آپلود کن (بهتر است افقی، مثلاً ۱۶:۶). هر بنر لینک و بازهٔ تاریخ اختیاری دارد و با برچسب «تبلیغ» نمایش داده می‌شود. چند بنر به‌صورت خودکار می‌چرخند.</p><div id="bnl">'+l.map(bnR).join('')+'</div>'+btn('bnadd','gy','＋ بنر جدید',{})+btn('bns','ok','💾 ذخیره و انتشار',{})+'</div>'};
document.addEventListener('change',async ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('bnf')||!t.files[0])return;try{toast('در حال آپلود بنر…');const u=await up(t.files[0],'banners',undefined,1600),r=t.closest('.bnr');r.querySelector('.bni').value=u;const p=r.querySelector('.bnp');p.src=u;p.hidden=false;toast('بنر آماده شد؛ «ذخیره» را بزن ✓')}catch(x){toast(x.message,0)}});
const CHS={open:'باز',closed:'بسته',draft:'پیش‌نویس'};
V.c=function(){if(D.ch===null)return'<div class="card empty">برای چالش، فایل supabase-setup.sql را یک بار دیگر در Supabase اجرا کن (بی‌خطر است).</div>';const sel=[0,1,2,3].map(i=>'<option value="'+i+'">گزینهٔ '+(i+1)+'</option>').join('');return'<div class="card"><h2 style="margin-top:0">🎯 چالش جدید</h2><p class="mu">سؤال و حداکثر ۴ گزینه بنویس و پاسخ درست را انتخاب کن (پاسخ درست برای بازدیدکنندگان دیده نمی‌شود). ساخت چالش جدید، چالش بازِ قبلی را می‌بندد.</p><div class="fg"><div class="fw"><label>سؤال *</label><input id="chq" placeholder="مثلاً پایتخت افغانستان کدام شهر است؟"></div>'+[0,1,2,3].map(i=>'<div><label>گزینهٔ '+(i+1)+(i<2?' *':'')+'</label><input class="cho"></div>').join('')+'<div><label>پاسخ درست</label><select id="cha">'+sel+'</select></div><div><label>جایزه</label><input id="chp" placeholder="مثلاً ۵۰۰ افغانی شارژ"></div></div>'+btn('chadd','ok','＋ ساخت و شروع چالش',{})+'</div>'+(D.ch.map(c=>{const n=D.en.filter(x=>x.challenge_id===c.id).length;return'<div class="it '+(c.status==='open'?'approved':'sold')+'"><div class="ib"><div class="ph">🎯</div><div style="min-width:0"><b>'+e(c.question)+'</b><span class="ch '+(c.status==='open'?'approved':'sold')+'">'+CHS[c.status]+'</span><div class="mu">🎁 '+e(c.prize||'—')+' | 👥 '+n+' شرکت‌کننده'+(c.winner?' | 🏆 '+e(c.winner):'')+'</div>'+(D.chv===c.id?'<pre>'+D.en.filter(x=>x.challenge_id===c.id).map(x=>(x.choice===D.chk?'✅ ':'❌ ')+x.name+' — '+x.phone).join('\n')+'</pre>':'')+'</div></div><div class="ac">'+btn('chlist','gy','👥 فهرست',{i:c.id})+(c.status==='open'?btn('chdraw','gd','🎲 قرعه‌کشی',{i:c.id})+btn('chcl','no','بستن',{i:c.id}):'')+btn('chdel','rd','🗑',{i:c.id})+'</div></div>'}).join('')||'<div class="empty">هنوز چالشی نساخته‌ای.</div>')};
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset;try{switch(d.act){
case'bnadd':D.bn=bnGet();D.bn.push({on:true});show('s');break;
case'bndel':D.bn=bnGet();D.bn.splice(+d.i,1);show('s');break;
case'bns':D.bn=bnGet();await saveSite({banners:D.bn});break;
case'chadd':{const q=$('chq').value.trim(),all=[...document.querySelectorAll('.cho')].map((x,i)=>({t:x.value.trim(),o:i})).filter(x=>x.t),an=+$('cha').value;if(q.length<3||all.length<2)return toast('سؤال و حداقل دو گزینه لازم است',0);const ix=all.findIndex(x=>x.o===an);if(ix<0)return toast('پاسخ درست باید یکی از گزینه‌های پرشده باشد',0);await api('challenges?status=eq.open','PATCH',{status:'closed'});const c=await api('challenges','POST',{question:q,options:all.map(x=>x.t),prize:$('chp').value.trim()||null,status:'open'});await api('challenge_keys','POST',{challenge_id:c[0].id,answer:ix},'return=minimal');toast('چالش شروع شد ✓');D.chv=null;await load();show('c');break}
case'chlist':{const k=(await api('challenge_keys?challenge_id=eq.'+d.i))[0];D.chv=D.chv==+d.i?null:+d.i;D.chk=k?k.answer:-1;show('c');break}
case'chcl':await api('challenges?id=eq.'+d.i,'PATCH',{status:'closed'});await load();show('c');break;
case'chdel':if(confirm('این چالش و شرکت‌کنندگانش حذف شود؟')){await api('challenges?id=eq.'+d.i,'DELETE');await load();show('c')}break;
case'chdraw':{const id=+d.i,k=(await api('challenge_keys?challenge_id=eq.'+id))[0];if(!k)return toast('پاسخ درست ثبت نشده',0);const ok=D.en.filter(x=>x.challenge_id===id&&x.choice===k.answer);if(!ok.length)return toast('هیچ پاسخ درستی ثبت نشده',0);const r=new Uint32Array(1);crypto.getRandomValues(r);const w=ok[r[0]%ok.length];await api('challenges?id=eq.'+id,'PATCH',{status:'closed',winner:w.name+' ('+w.phone.slice(0,3)+'•••'+w.phone.slice(-3)+')'});await load();show('c');alert('🎉 برندهٔ قرعه‌کشی\n\nنام: '+w.name+'\nشماره: '+w.phone+'\n\n(از میان '+ok.length+' پاسخ درست)');break}
}}catch(x){toast(String(x.message).slice(0,140),0)}});
if(T)api('admins?select=user_id').then(a=>a.length?start():out()).catch(out);
